name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set UID
        run: echo "UID=$(id --user)" > .env
      - name: Build the containers
        run: make build
      - name: Lint the code
        run: make lint
      - name: Run test suite
        run: make test
